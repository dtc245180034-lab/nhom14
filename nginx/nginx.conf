worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format main '$remote_addr - $request_method $uri $status $body_bytes_sent $request_time';
  access_log /var/log/nginx/access.log main;
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  upstream project_app { server app:3000; keepalive 16; }
  server {
    listen 8080;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'self'" always;
    location / { limit_req zone=api burst=40 nodelay; proxy_pass http://project_app; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /nginx_status { stub_status; allow 127.0.0.1; allow 172.16.0.0/12; deny all; }
  }
}

